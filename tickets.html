<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spring Inspiration - Tickets</title>

    <!-- Playfair Display and Inter fonts typekit from Adobe Fonts -->
    <link rel="stylesheet" href="CSS/main.css" />
  </head>
  <body>
    <header>
      <!-- Navigation bar -->
      <nav>
        <ul class="nav-list">
          <li>
            <a href="index.html" class="nav-link active"
              ><img
                src="Assets/home-02-svgrepo-com.svg"
                alt="Homepage icon"
                class="nav-icon"
            /></a>
          </li>
          <li><a href="gallery.html" class="nav-link">Gallery</a></li>
          <!-- Adds space between the gallery and ticket pages in the navigation bar-->
          <li class="nav-spacer"></li>
          <li><a href="tickets.html" class="nav-link">Tickets</a></li>
          <li>
            <a href="cart.html" class="nav-link"

                src="Assets/cart-4-svgrepo-com.svg"

      <!-- Middle section of the footer with the menu links -->

        <ul class="footer-nav-list">

        <a href="#">
          <img
            src="Assets/instagram-svgrepo-com.svg"
            alt="Instagram icon"
            class="social-icon"
          />

        </a>

        <a href="#">
          <img
            src="Assets/tik-tok-brand-assets-video-socialnetwork-oneline-svgrepo-com.svg"
            alt="TikTok icon"
            class="social-icon"
          />

        </a>

        <a href="#">
          <img
            src="Assets/facebook-svgrepo-com.svg"
            alt="Facebook icon"
            class="social-icon"
          />
          Facebook
        </a>
