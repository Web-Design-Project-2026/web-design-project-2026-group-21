<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spring Inspiration - Gallery</title>

    <!-- Playfair Display and Inter fonts typekit from Adobe Fonts -->
    <link rel="stylesheet" href="CSS/main.css" />
  </head>
  <body>
    <header>
      <!-- Navigation bar -->
      <nav>
        <ul class="nav-list">
          <li>
            <a href="index.html" class="nav-link active"
              ><img
                src="Assets/home-02-svgrepo-com.svg"
                alt="Homepage icon"
                class="nav-icon"
            /></a>
          </li>
          <li><a href="gallery.html" class="nav-link">Gallery</a></li>
          <!-- Adds space between the gallery and ticket pages in the navigation bar-->
          <li class="nav-spacer"></li>
          <li><a href="tickets.html" class="nav-link">Tickets</a></li>
          <li>
            <a href="cart.html" class="nav-link"
              ><img
                src="Assets/cart-4-svgrepo-com.svg"
                alt="Cart icon"
                class="nav-icon"
            /></a>
          </li>
        </ul>
      </nav>
    </header>

    <!-- Gallery grid -->

    <main>
      <section class="gallery">
        <div class="gallery-grid">
          <!-- Spring Inspiration designs -->

          <div class="gallery-item-horizontal">
            <img
              src="Images/_DSC9792.jpg"
              alt="Spring Inspiration's full collection"
              class="spring-full-collection"
            />
            <div class="gallery-logo">
              <img src="Assets/SPRINGLOGO.png" class="logo-spring" />
            </div>
          </div>

          <div class="gallery-item-vertical">
            <img
              src="Images/_DSC9578.jpg"
              alt="Spring Inspiration design"
              class="spring-design"
            />
          </div>

          <div class="gallery-item-vertical">
            <img
              src="Images/_DSC9643.jpg"
              alt="Spring Inspiration design"
              class="spring-design"
            />
          </div>
          <div class="gallery-item-vertical">
            <img
              src="Images/_MG_6512.jpg"
              alt="Spring Inspiration design"
              class="spring-design"
            />
          </div>

          <div class="gallery-item-vertical">
            <img
              src="Images/_MG_6461.jpg"
              alt="Spring Inspiration design"
              class="spring-design"
            />
          </div>

          <!-- Koonverd's designs -->

          <div class="gallery-item-horizontal">
            <img
              src="Images/_DSC0718.jpg"
              alt="Koonverd's design"
              class="koonverd-design"
            />
            <div class="gallery-logo">
              <img src="Assets/tag KNVRD.png" class="logo-koonverd" />
            </div>
          </div>

          <div class="gallery-item-vertical">
            <img
              src="Images/_DSC0647.jpg"
              alt="Koonverd's design"
              class="koonverd-design"
            />
          </div>
          <div class="gallery-item-vertical">
            <img
              src="Images/_DSC8050.jpg"
              alt="Koonverd's design"
              class="koonverd-design"
            />
          </div>

          <div class="gallery-item-horizontal">
            <img
              src="Images/_MG_7149.jpg"
              alt="Koonverd's design"
              class="koonverd-design"
            />
          </div>

          <!-- Anastasia Studio's designs -->

          <div class="gallery-item-horizontal">
            <img
              src="Images/_DSC2413.jpg"
              alt="Anastasia Studio's design"
              class="anastasia-design"
            />
            <div class="gallery-logo">
              <img
                src="Assets/ANNASTASIA STUDIOS.png"
                class="logo-anastasias-studios"
              />
            </div>
          </div>

          <div class="gallery-item-vertical">
            <img
              src="Images/_DSC2083.jpg"
              alt="Anastasia Studio's design"
              class="anastasia-design"
            />
          </div>

          <div class="gallery-item-vertical">
            <img
              src="Images/_DSC1983.jpg"
              alt="Anastasia Studio's design"
              class="anastasia-design"
            />
          </div>

          <div class="gallery-item-horizontal">
            <img
              src="Images/_MG_8017.jpg"
              alt="Anastasia Studio's design"
              class="anastasia-design"
            />
          </div>

          <div class="gallery-item-horizontal">
            <img
              src="Images/_DSC1896.jpg"
              alt="Anastasia Studio's design"
              class="anastasia-design"
            />
          </div>
        </div>
      </section>
    </main>

    <footer>
      <!-- Left side of the footer with the Spring Inspiration logo and copyright text -->
      <div class="footer-logo">
        <img src="Assets/springinspiration.png" alt="Spring Inspiration logo" />
        <p>&copy; Spring Inspiration 2026</p>
      </div>
      <!-- Middle section of the footer with the menu links -->
      <div class="footer-nav">
        <h4>Menu</h4>
        <ul class="footer-nav-list">
          <li><a href="index.html" class="footer-link">Homepage</a></li>
          <li><a href="gallery.html" class="footer-link">Gallery</a></li>
          <li><a href="tickets.html" class="footer-link">Tickets</a></li>
        </ul>
      </div>

      <!-- Right side of the footer with the social media links -->

      <div class="footer-social">
        <h4>Follow Us</h4>
        <a href="#">
          <img
            src="Assets/instagram-svgrepo-com.svg"
            alt="Instagram icon"
            class="social-icon"
          />
          Instagram
        </a>

        <a href="#">
          <img
            src="Assets/tik-tok-brand-assets-video-socialnetwork-oneline-svgrepo-com.svg"
            alt="TikTok icon"
            class="social-icon"
          />
          TikTok
        </a>

        <a href="#">
          <img
            src="Assets/facebook-svgrepo-com.svg"
            alt="Facebook icon"
            class="social-icon"
          />
          Facebook
        </a>
      </div>
    </footer>
  </body>
</html>
